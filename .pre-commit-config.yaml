# .pre-commit-config.yaml (Layer 1 Gatekeeper Fallback)
# Refer to: https://pre-commit.com

default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: secret-scan-patterns
        name: Secret Scan Patterns
        entry: python -c "import sys, re; patterns=[r'sk-[a-zA-Z0-9]{20,}', r'gh[pousr]_[A-Za-z0-9_]{36,}', r'AIza[0-9A-Za-z\-_]{35}', r'(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}', r'-----BEGIN [A-Z ]*PRIVATE KEY-----']; files=sys.argv[1:]; failed=[(f, p) for f in files for p in patterns if open(f, 'r', encoding='utf-8', errors='ignore').read() and re.search(p, open(f, 'r', encoding='utf-8', errors='ignore').read())]; sys.exit(1 if failed and [print(f'Secret detected in {f}: pattern {p}') for f, p in failed] else 0)"
        language: system
        types: [text]

      - id: conventional-commit-msg
        name: Conventional Commit Message Validation
        entry: python -c "import sys, re; msg=open(sys.argv[1], 'r', encoding='utf-8').readline().strip(); pat=r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+$'; sys.exit(0 if re.match(pat, msg) else (print('Commit message must match Conventional Commits format <type>(<scope>): <desc>') or 1))"
        language: system
        stages: [commit-msg]
