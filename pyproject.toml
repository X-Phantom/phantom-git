[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-git"
version = "0.1.0"
description = "Phantom Git (pgit / git-mgr) — Agentic Git Orchestrator & Multi-Repo Manager designed for developers and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Git Manager Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
phantom-git = "git_manager.cli:app"
pgit = "git_manager.cli:app"
git-mgr = "git_manager.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_manager = ["tui/*.tcss", "scaffold/templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
